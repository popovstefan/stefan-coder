baseurl = "https://popovstefan.github.io/stefan-coder/"
title = "Stefan Popov / Стефан Попов"
theme = "hugo-coder"
languageCode = "en"
defaultContentLanguage = "en"
disableKinds = ["RSS", "taxonomy", "term"]

[taxonomies]

[markup.highlight]
style = "github-dark"

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[params]
  author = "Stefan Popov"
  info = "Machine-Learning Engineer"
  description = "Stefan Popov's personal website"
  keywords = "developer,personal"
  avatarurl = "images/avatar.jpg"
  #gravatar = "john.doe@example.com"
  favicon = "favicon.ico"
  favicon_32 = "favicon-32x32.png"
  favicon_16 = "favicon-16x16.png"

  since = 2026

  enableTwemoji = true

  colorScheme = "auto"
  hidecolorschemetoggle = false

  # customCSS = ["css/custom.css"]
  # customSCSS = ["scss/custom.scss"]
  # customJS = ["js/custom.js"]

# Social links
[[params.social]]
  name = "Github"
  icon = "fa-brands fa-github fa-2x"
  weight = 1
  url = "https://github.com/popovstefan/"
[[params.social]]
  name = "LinkedIn"
  icon = "fa-brands fa-linkedin fa-2x"
  weight = 2
  url = "https://www.linkedin.com/in/popovstefan/"

# Menu links
[[menu.main]]
  name = "About"
  weight = 1
  url = "about/"
[[menu.main]]
  name = "Experience"
  weight = 2
  url  = "experience/"